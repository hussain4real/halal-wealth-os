name: tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      failure_probe:
        description: Repeat verification to check deliberate failure propagation
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  pest:
    name: Pest shard ${{ matrix.shard }} of 8
    if: github.event_name != 'workflow_dispatch' || !inputs.failure_probe
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ubuntu-latest
    env: &verification-env
      APP_ENV: testing
      LARAVEL_INSTALLER_DEFER_HOOKS: 'true'
      HWO_DISPOSABLE_DATABASE: halal_wealth_os_test
      HWO_TEST_HOST: 127.0.0.1
      HWO_TEST_PORT: '5432'
      HWO_TEST_USER: hwo

    services: &verification-services
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: hwo
          POSTGRES_DB: halal_wealth_os_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U hwo -d halal_wealth_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - &checkout
        name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - &require-locks
        name: Require resolved dependency locks
        run: test -f composer.lock && test -f package-lock.json

      - &php
        name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5.12'
          tools: composer:2.10.3
          extensions: curl, pdo_pgsql, bcmath, intl, pcntl, zip, sodium
          coverage: pcov
          ini-values: pcov.directory=app

      - &node
        name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm

      - &postgres-client
        name: Use the pinned PostgreSQL service client
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/hwo-tools"
          for tool in psql pg_dump pg_restore; do
            printf '#!/usr/bin/env bash\nexec docker exec -i %s %s "$@"\n' "$POSTGRES_CONTAINER_ID" "$tool" > "$RUNNER_TEMP/hwo-tools/$tool"
            chmod +x "$RUNNER_TEMP/hwo-tools/$tool"
          done
          printf '%s\n' "$RUNNER_TEMP/hwo-tools" >> "$GITHUB_PATH"

      - &install
        name: Install from locks without create-project side effects
        run: |
          cp .env.testing.example .env.testing
          composer install --prefer-dist --no-interaction --no-progress --no-scripts
          php artisan package:discover --ansi
          npm ci --ignore-scripts --no-fund

      - &identify-run
        name: Identify this verification attempt
        run: |
          id=$(printf '%s/%s/%s' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" | sha256sum | cut -c1-32)
          printf 'HWO_RELEASE_RUN_ID=%s\n' "$id" >> "$GITHUB_ENV"

      - name: Run uncached Pest shard
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/verify-ci-shard.mjs "$SHARD"

      - name: Upload same-run verification reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pest-shard-${{ matrix.shard }}
          path: build/ci-shard/
          if-no-files-found: error
          retention-days: 1

  ci:
    if: ${{ always() }}
    needs: pest
    runs-on: ubuntu-latest
    env: *verification-env
    services: *verification-services
    steps:
      - name: Check shard outcome
        env:
          SHARDS_RESULT: ${{ needs.pest.result }}
          FAILURE_PROBE: ${{ github.event_name == 'workflow_dispatch' && inputs.failure_probe }}
        run: |
          if test "$FAILURE_PROBE" = true; then
            test "$SHARDS_RESULT" = skipped
          else
            test "$SHARDS_RESULT" = success
          fi

      - *checkout
      - *require-locks
      - name: Verify public progress eligibility
        run: |
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
          test -z "$(git status --porcelain --untracked-files=normal)"

      - *php
      - *node
      - *postgres-client
      - *install
      - *identify-run

      - name: Download same-run shard reports
        if: github.event_name != 'workflow_dispatch' || !inputs.failure_probe
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pest-shard-*
          path: build/ci-shards

      - name: Verify all shard reports and remaining checks
        if: github.event_name != 'workflow_dispatch' || !inputs.failure_probe
        run: ./bin/verify --ci-shards

      - name: Verify baseline, deliberate failure and restored baseline
        if: github.event_name == 'workflow_dispatch' && inputs.failure_probe
        run: ./bin/probe-failure

      - name: Retain test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: m7-p3-verification
          path: |
            build/junit.xml
            build/coverage.xml
            build/financial-coverage.json
            build/acceptance-http.json
            build/acceptance-map-report.json
            build/ci-acceptance-report.json
            build/release-recovery.json
            build/release-record.json
            build/ci-verification-record.json
          if-no-files-found: warn
          retention-days: 7

      - name: Report local artifact locations
        if: always()
        run: |
          for report in build/junit.xml build/coverage.xml build/financial-coverage.json build/acceptance-http.json build/acceptance-map-report.json build/ci-acceptance-report.json build/release-recovery.json build/release-record.json build/ci-verification-record.json; do
            if test -f "$report"; then
              printf '%s\n' "$report" >> "$GITHUB_STEP_SUMMARY"
            else
              printf 'NOT_PRODUCED: %s\n' "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  devnull:
    name: Publish dev progress
    needs: ci
    if: >-
      success() && needs.ci.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/dev' &&
      github.run_attempt == 1 && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: devnull-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Checkout verified merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare public merged-PR update
        id: progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/devnull_progress.py

      - name: Publish signed progress update
        if: steps.progress.outputs.publish == 'true'
        uses: nunomaduro/dev-null.sh/.github/actions/commit@ee0ca417d219567146f633f69069790de89fd3e9
        with:
          body: ${{ steps.progress.outputs.body }}
          ssh-key: ${{ secrets.DEVNULL_SSH_KEY }}
