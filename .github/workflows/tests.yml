name: tests

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      LARAVEL_INSTALLER_DEFER_HOOKS: 'true'
      HWO_DISPOSABLE_DATABASE: halal_wealth_os_test
      HWO_TEST_HOST: 127.0.0.1
      HWO_TEST_PORT: '5432'
      HWO_TEST_USER: hwo
      XDEBUG_MODE: coverage

    services:
      postgres:
        image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
        env:
          POSTGRES_USER: hwo
          POSTGRES_DB: halal_wealth_os_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U hwo -d halal_wealth_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require resolved dependency locks
        run: test -f composer.lock && test -f package-lock.json

      - name: Verify public progress eligibility
        run: |
          python3 -B -m unittest discover -s .github/scripts -p 'test_*.py'
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5.12'
          tools: composer:2.10.3
          extensions: pdo_pgsql, bcmath, intl, pcntl, zip, sodium, xdebug-3.5.3
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          cache: npm

      - name: Use the pinned PostgreSQL service client
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/hwo-tools"
          for tool in psql pg_dump pg_restore; do
            printf '#!/usr/bin/env bash\nexec docker exec -i %s %s "$@"\n' "$POSTGRES_CONTAINER_ID" "$tool" > "$RUNNER_TEMP/hwo-tools/$tool"
            chmod +x "$RUNNER_TEMP/hwo-tools/$tool"
          done
          printf '%s\n' "$RUNNER_TEMP/hwo-tools" >> "$GITHUB_PATH"

      - name: Install from locks without create-project side effects
        run: |
          cp .env.testing.example .env.testing
          composer install --prefer-dist --no-interaction --no-progress --no-scripts
          php artisan package:discover --ansi
          npm ci --ignore-scripts --no-fund

      - name: Verify baseline, deliberate failure and restored baseline
        run: ./bin/probe-failure

      - name: Retain test and coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: m5-p3-verification
          path: |
            build/junit.xml
            build/coverage.xml
            build/financial-coverage.json
            build/acceptance-http.json
            build/acceptance-map-report.json
            build/release-recovery.json
            build/release-record.json
          if-no-files-found: warn
          retention-days: 7

      - name: Report local artifact locations
        if: always()
        run: |
          for report in build/junit.xml build/coverage.xml build/financial-coverage.json build/acceptance-http.json build/acceptance-map-report.json build/release-recovery.json build/release-record.json; do
            if test -f "$report"; then
              printf '%s\n' "$report" >> "$GITHUB_STEP_SUMMARY"
            else
              printf 'NOT_PRODUCED: %s\n' "$report" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  devnull:
    name: Publish dev progress
    needs: ci
    if: >-
      success() && needs.ci.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/dev' &&
      github.run_attempt == 1 && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: devnull-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - name: Checkout verified merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Prepare public merged-PR update
        id: progress
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/devnull_progress.py

      - name: Publish signed progress update
        if: steps.progress.outputs.publish == 'true'
        uses: nunomaduro/dev-null.sh/.github/actions/commit@ee0ca417d219567146f633f69069790de89fd3e9
        with:
          body: ${{ steps.progress.outputs.body }}
          ssh-key: ${{ secrets.DEVNULL_SSH_KEY }}
